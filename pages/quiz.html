        function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        // swap
        [array[i], array[j]] = [array[j], array[i]];
    }

        function startTotalTimer() {

            totalQuizTimer = setInterval(() => {

                const seconds = totalTimeLeft % 60;

            }, 1000);

        function startQuestionTimer() {
            timeLeftForQuestion = QUESTION_TIME;
            const timerElement = document.getElementById('timer');
            
            questionTimer = setInterval(() => {
                const minutes = Math.floor(timeLeftForQuestion / 60);
                const seconds = timeLeftForQuestion % 60;
                timerElement.textContent = `Question Time: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    
                if (timeLeftForQuestion <= 0) {

                    nextQuestion();
                } else {
                    timeLeftForQuestion--;
                }
            }, 1000);

        function showQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('question').textContent = question.question;
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });
            startQuestionTimer();
        }
    
        function selectOption(selectedIndex) {
            const question = questions[currentQuestionIndex];
            if (selectedIndex === question.answer) {
                correctAnswers++;
            }
            nextQuestion();
        }
    
        function nextQuestion() {
            clearInterval(questionTimer);
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }
    
        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            if (correctAnswers >= 20) {

            } else {

function downloadCertificate() {
    const name = document.getElementById('name').value.trim().toUpperCase();

    if (!name) {
        alert("Please enter a name.");
        return;
    }

    const canvas = document.getElementById('certificate-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 1200;
    canvas.height = 700;

   // 🎨 BACKGROUND (soft premium gradient)
let bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
bg.addColorStop(0, "#f8fafc");
bg.addColorStop(1, "#eef2f7");
ctx.fillStyle = bg;
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ✨ subtle radial highlight (premium depth)
let glow = ctx.createRadialGradient(
    canvas.width / 2,
    canvas.height / 2,
    100,
    canvas.width / 2,
    canvas.height / 2,
    600
);
glow.addColorStop(0, "rgba(255,255,255,0.6)");
glow.addColorStop(1, "rgba(255,255,255,0)");

ctx.fillStyle = glow;
ctx.fillRect(0, 0, canvas.width, canvas.height);

// 🧊 WATERMARK (👉 YAHI ADD KARNA HAI)
const watermark = new Image();
watermark.src = '../media/centerlogo.png';

watermark.onload = function () {
    ctx.globalAlpha = 0.05;
    ctx.drawImage(watermark, canvas.width/2 - 200, canvas.height/2 - 200, 400, 400);
    ctx.globalAlpha = 1;

    // 👉 IMPORTANT: baaki drawing isi ke andar hona chahiye
    drawCertificateContent();
};

ctx.globalAlpha = 1;

    // 🟦 CLEAN BORDER (fixed spacing)
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#1e293b";
    ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

    ctx.lineWidth = 2;
    ctx.strokeStyle = "#d4af37";
    ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

    ctx.textAlign = "center";

    // 🏆 TITLE
    ctx.font = "bold 44px Georgia";
    ctx.fillStyle = "#0f172a";
    ctx.fillText("CERTIFICATE OF COMPLETION", canvas.width / 2, 100);

    // subtitle
    ctx.font = "20px Arial";
    ctx.fillStyle = "#555";
    ctx.fillText("This certificate is proudly presented to", canvas.width / 2, 160);

    // 👤 NAME
    ctx.font = "bold 50px Georgia";
    ctx.fillStyle = "#000";
    ctx.fillText(name, canvas.width / 2, 230);

    // underline
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2 - 250, 250);
    ctx.lineTo(canvas.width / 2 + 250, 250);
    ctx.strokeStyle = "#d4af37";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 📘 COURSE TEXT
    ctx.font = "20px Arial";
    ctx.fillStyle = "#444";
    ctx.fillText("has successfully completed the course", canvas.width / 2, 300);

    ctx.fillStyle = "#1e293b";
ctx.font = "bold 30px Arial";
ctx.fillText("The Distribution Blueprint", canvas.width / 2, 340);

// highlight line
ctx.beginPath();
ctx.moveTo(canvas.width / 2 - 180, 355);
ctx.lineTo(canvas.width / 2 + 180, 355);
ctx.strokeStyle = "#d4af37";
ctx.lineWidth = 2;
ctx.stroke();

    // 📊 SCORE (clean readable)
    ctx.font = "17px Arial";
    ctx.fillStyle = "#333";
    ctx.fillText(
        `Achieved scored ${correctAnswers} out of ${questions.length} in the final assessment`,
        canvas.width / 2,
        380
    );

    // 📅 DATE
    const date = new Date().toLocaleDateString();
    ctx.textAlign = "left";
    ctx.font = "18px Arial";
    ctx.fillText("Date: " + date, 120, 540);

    // 🏷️ CERT ID
    ctx.textAlign = "right";
    const certId = "DB-" + Date.now();
    ctx.fillText("Certificate ID: " + certId, canvas.width - 120, 540);

    // 🔧 IMAGE RATIO FIX FUNCTION
    function drawImageProper(img, centerX, centerY, maxW, maxH) {
        const ratio = Math.min(maxW / img.width, maxH / img.height);
        const w = img.width * ratio;
        const h = img.height * ratio;
        ctx.drawImage(img, centerX - w / 2, centerY - h / 2, w, h);
    }

    // 🖼️ LOAD ALL IMAGES (proper flow)
    const logoMain = new Image();
    const logoRight = new Image();
    const logoLeft = new Image();
    const signature = new Image();

    logoMain.src = '../media/backimage.jpeg';
    logoRight.src = '../media/STlogo.png';
    logoLeft.src = '../media/centerlogo.png';
    signature.src = '../media/Signaturepng.png';

    let loaded = 0;
    function checkLoad() {
        loaded++;
        if (loaded === 4) drawAll();
    }

    logoMain.onload = checkLoad;
    logoRight.onload = checkLoad;
    logoLeft.onload = checkLoad;
    signature.onload = checkLoad;

    function drawAll() {

        // 🎵 CENTER IMAGE (no stretch)
        drawImageProper(logoMain, canvas.width / 2, 470, 180, 100);

        // 🏢 TOP LEFT LOGO
        drawImageProper(logoLeft, canvas.width - 260, 610, 120, 60);

        // 🏁 BOTTOM RIGHT LOGO
        drawImageProper(logoRight, canvas.width - 140, 610, 140, 70);

        // ✍️ SIGNATURE IMAGE (FIXED POSITION)
        drawImageProper(signature, 200, 600, 180, 70);

        ctx.textAlign = "left";
        ctx.font = "16px Arial";
        ctx.fillText("Authorized Signature", 120, 630);

        // 🌐 WEBSITE (VISIBLE FIXED)
        ctx.textAlign = "center";
        ctx.font = "bold 18px Arial";
        ctx.fillStyle = "#000";
        ctx.fillText("www.Distributionblueprint.in", canvas.width / 2, 665);

        // download
        const link = document.createElement('a');
        link.href = canvas.toDataURL();
        link.download = 'certificate.png';
        link.click();
    }
}

// Utility function for text wrapping
function wrapText(ctx, text, startY, maxWidth) {
    let words = text.split(' ');
    let line = '';
    let lines = [];

    for (let i = 0; i < words.length; i++) {
        let testLine = line + words[i] + ' ';
        let testWidth = ctx.measureText(testLine).width;
        if (testWidth > maxWidth) {
            lines.push(line);
            line = words[i] + ' ';
        } else {
            line = testLine;
        }
    }
    lines.push(line);

    // Now center-align the text for each line
    for (let j = 0; j < lines.length; j++) {
        let lineWidth = ctx.measureText(lines[j]).width;
        ctx.fillText(lines[j], ctx.canvas.width / 2 - lineWidth / 2, startY + j * 35); // Center aligned text
    }

    return lines;
}

// Utility function for text wrapping
function wrapText(ctx, text, x, y, maxWidth) {
    let words = text.split(' ');
    let line = '';
    let lines = [];

    for (let i = 0; i < words.length; i++) {
        let testLine = line + words[i] + ' ';
        let testWidth = ctx.measureText(testLine).width;
        if (testWidth > maxWidth) {
            lines.push(line);
            line = words[i] + ' ';
        } else {
            line = testLine;
        }
    }
    lines.push(line);

    // Now center-align the text for each line
    for (let j = 0; j < lines.length; j++) {
        let lineWidth = ctx.measureText(lines[j]).width;
        ctx.fillText(lines[j], x - lineWidth / 2, y + j * 30); // Corrected to center the line
    }

    return lines;
}
